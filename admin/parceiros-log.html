<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Alterações dos parceiros | Admin</title><link rel="stylesheet" href="/parceiro/parceiro.css"></head><body><header><strong>Alterações dos parceiros</strong><a href="/admin/guia">Voltar ao guia</a></header><main><h1>Histórico de alterações</h1><p id="notice" role="status"></p><table><thead><tr><th>Data</th><th>Cadastro</th><th>Campos</th></tr></thead><tbody id="rows"></tbody></table></main><script type="module">import{exigirPermissao}from'./auth.js';import{getSupabase}from'../assets/js/services/supabaseClient.js';const access=await exigirPermissao('guia_comercial','editar');if(access){const id=new URLSearchParams(location.search).get('guia_id'),db=getSupabase();let query=db.from('parceiro_alteracoes_log').select('guia_id,campos_alterados,criado_em').order('criado_em',{ascending:false}).limit(100);if(id)query=query.eq('guia_id',id);const{data,error}=await query;if(error)document.querySelector('#notice').textContent=error.message;else for(const row of data){const tr=document.createElement('tr');for(const value of[new Date(row.criado_em).toLocaleString('pt-BR'),row.guia_id,row.campos_alterados.join(', ')]){const td=document.createElement('td');td.textContent=value;tr.append(td);}document.querySelector('#rows').append(tr);}}</script></body></html>
