<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Assinatura Viva | CMS</title><link rel="stylesheet" href="/parceiro/parceiro.css"><link rel="stylesheet" href="/parceiro/mobile.css"></head><body><header class="partner-header"><strong>Assinaturas Viva</strong><a href="/admin/guia">Voltar ao Guia</a></header><main><h1>Plano Parceiro Viva</h1><p>Exclusivo do aplicativo. Não altera assinaturas de publicidade.</p><form id="subscription-form"><label>Empresa<select id="company" required><option value="">Selecione uma empresa</option></select></label><p id="current-state" role="status"></p><label>Período<select name="periodo"><option value="mensal">Mensal · R$ 79,90</option><option value="semestral">Semestral · R$ 419,90</option><option value="anual">Anual · R$ 759,90</option></select></label><label>Início<input type="date" name="inicio" required></label><label>Válido até (inclusive)<input type="date" name="validade" required></label><button type="button" id="calculate">Calcular validade pelo período</button><label>Situação<select name="status"><option value="pendente">Aguardando confirmação</option><option value="ativa">Ativa</option><option value="pausada">Pausada</option><option value="cancelada">Cancelada</option></select></label><label><input type="checkbox" name="pago"> Confirmo que o pagamento deste período foi recebido</label><p>Ao renovar, confira o início do novo período e sua validade. Nenhum débito é realizado por esta tela. A validade segue o horário de Brasília.</p><button type="submit" disabled>Salvar assinatura</button></form><p id="notice" role="status"></p><h2>Histórico</h2><ul id="subscription-history"></ul></main><script type="module" src="/admin/viva-assinaturas.js"></script></body></html>
