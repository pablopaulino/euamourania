<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Submissões públicas | Painel Eu Amo Urânia</title>
    <link rel="stylesheet" href="admin.css" />
    <link rel="stylesheet" href="cms-redesign.css" />
    <link rel="stylesheet" href="submissoes.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="admin-shell">
      <aside class="admin-sidebar" id="sidebar">
        <img
          src="../assets/1505 - Urania - Logo Horizontal - 1.png"
          alt="Eu Amo Urânia"
          class="admin-logo"
        />
        <nav class="admin-nav" aria-label="Seções do painel">
          <button type="button" onclick="location.href='index.html'">Voltar ao painel</button>
          <button type="button" class="active">Submissões públicas</button>
        </nav>
        <div class="admin-sidebar-footer">
          <p id="admin-user"></p>
          <button id="logout" class="admin-button secondary">Sair</button>
        </div>
      </aside>
      <main class="admin-main">
        <header class="admin-topbar">
          <div>
            <button id="mobile-menu" class="admin-button secondary mobile-menu">
              Menu
            </button>
            <h1>Submissões públicas</h1>
            <p class="admin-page-hint">
              Revise empresas e eventos enviados pelo público. Imagens são escolhidas apenas pela equipe no painel.
            </p>
          </div>
          <a class="admin-button secondary" href="../index.html" target="_blank" rel="noopener">Ver site ↗</a>
        </header>
        <section id="submissions-app" class="submissions-shell loading">Carregando submissões…</section>
      </main>
    </div>
    <script type="module" src="submissoes.js"></script>
