<!doctype html>
<html lang="pt-BR">
  <head><meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8" />
    <base href="/admin/" />

    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Painel administrativo | Eu Amo Urânia</title>
    <link rel="stylesheet" href="/admin/admin-theme.css" />
    <link rel="stylesheet" href="/admin/admin-shell.css" />
    <link rel="stylesheet" href="/admin/admin-components.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css"
    />
    <link rel="stylesheet" href="/admin/resource-layouts.css" />
    <link rel="stylesheet" href="/admin/dashboard.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"
      defer
    ></script>
  </head>
  <body data-admin-shell="true">
    <div class="admin-shell">
      <aside class="admin-sidebar" id="sidebar">
        <div class="admin-sidebar-head">
          <img
            src="/assets/1505 - Urania - Logo Horizontal - 1.png"
            alt="Eu Amo Urânia"
            class="admin-logo"
          />
          <button
            id="sidebar-toggle"
            class="sidebar-toggle"
            type="button"
            aria-label="Recolher menu"
            aria-expanded="true"
          >
            <span aria-hidden="true">‹</span>
          </button>
        </div>
        <nav class="admin-nav" aria-label="Seções do painel"></nav>
        <div class="admin-sidebar-footer">
          <p id="admin-user"></p>
          <button id="logout" class="admin-button secondary">Sair</button>
        </div>
      </aside>
      <main class="admin-main">
        <header class="admin-topbar">
          <button id="mobile-menu" class="admin-button secondary mobile-menu" aria-label="Abrir menu">
            Menu
          </button>
          <div class="admin-topbar-context">
            <div class="admin-topbar-title-row">
              <span id="page-title-icon" class="admin-page-icon admin-topbar-icon" aria-hidden="true"></span>
              <div>
                <p id="page-context" class="admin-page-context">Operação</p>
                <h1 id="page-title">Visão geral</h1>
              </div>
            </div>
            <p id="page-hint" class="admin-page-hint">
              Acompanhe os principais dados do portal e escolha um módulo no
              menu para gerenciar conteúdo, publicidade, comunicação e
              configurações.
            </p>
          </div>
          <div class="admin-topbar-actions">
            <button class="admin-button secondary" type="button" id="refresh-data">Atualizar dados</button>
            <span id="page-primary-action" class="admin-page-primary-action"></span>
            <button class="admin-command-trigger" type="button" data-open-command-palette>
              <span>Buscar no painel</span>
              <kbd>Ctrl K</kbd>
            </button>
            <a
              class="admin-button secondary"
              href="/"
              target="_blank"
              rel="noopener"
              >Ver site ↗</a
            >
          </div>
        </header>
        <nav id="section-tabs" class="admin-tabs" aria-label="Abas da seção" hidden></nav>
        <div id="app-content">Verificando acesso…</div>
      </main>
    </div>
    <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="Fechar menu"></button>
    <div class="toast-stack" id="toasts" aria-live="polite"></div>
    <script type="module" src="/admin/entry.js"></script>
  </body>
</html>
