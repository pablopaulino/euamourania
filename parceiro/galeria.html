<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Galeria | Parceiro</title><link rel="stylesheet" href="/parceiro/parceiro.css"></head><body><header><strong id="partner-name">Parceiro</strong><button id="logout">Sair</button></header><nav><a href="/parceiro">Início</a><a href="/parceiro/perfil">Perfil</a><a href="/parceiro/horarios">Horários</a><a href="/parceiro/galeria" aria-current="page">Galeria</a><a href="/parceiro/vantagens">Promoções</a></nav><main data-needs-guide><h1>Galeria de fotos</h1><p>A primeira foto é a capa do cadastro. Até 10 fotos de 5 MB cada.</p><div id="gallery" class="gallery"></div><form id="form"><label>Adicionar foto<input type="file" accept="image/jpeg,image/png,image/webp" required></label><button>Enviar foto</button></form><p id="notice" role="status"></p></main><script type="module">import{acesso,salvar,upload,notice}from'/parceiro/_layout.js';if(acesso?.guia){let urls=Array.isArray(acesso.guia.galeria_urls)?[...acesso.guia.galeria_urls]:[];const grid=document.querySelector('#gallery');function render(){grid.replaceChildren();urls.forEach((url,i)=>{const box=document.createElement('div');box.className='card';const img=document.createElement('img');img.src=url;img.alt=`Foto ${i+1}`;const btn=document.createElement('button');btn.textContent='Remover';btn.onclick=async()=>{try{const next=urls.filter((_,index)=>index!==i);await salvar({galeria_urls:next,imagem_url:next[0]||null});urls=next;render();}catch(err){notice(err.message,true);}};box.append(img,btn);grid.append(box);});}render();document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();try{if(urls.length>=10)throw Error('Limite de 10 fotos atingido.');const file=e.target.querySelector('input').files[0];const url=await upload(file);const next=[...urls,url];await salvar({galeria_urls:next,imagem_url:next[0]});urls=next;render();e.target.reset();}catch(err){notice(err.message,true);}});}</script></body></html>
