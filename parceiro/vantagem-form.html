<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Editar promoção | Parceiro</title><link rel="stylesheet" href="/parceiro/parceiro.css"></head><body><header><strong id="partner-name">Parceiro</strong><button id="logout">Sair</button></header><nav><a href="/parceiro">Início</a><a href="/parceiro/perfil">Perfil</a><a href="/parceiro/horarios">Horários</a><a href="/parceiro/galeria">Fotos</a><a href="/parceiro/vantagens" aria-current="page">Promoções</a></nav><main data-needs-guide><h1>Promoção</h1><p>A equipe precisa aprovar a publicação após salvar.</p><form id="form"><label>Tipo<select name="tipo"><option value="cupom">Cupom</option><option value="desconto">Desconto</option><option value="produto">Produto</option><option value="promocao">Promoção</option><option value="acao">Ação</option><option value="brinde">Brinde</option><option value="beneficio">Benefício</option></select></label><label>Título<input name="titulo" required></label><label>Descrição<textarea name="descricao"></textarea></label><label>Início<input type="datetime-local" name="data_inicio" required></label><label>Fim<input type="datetime-local" name="data_fim"></label><label>Preço original<input type="number" step="0.01" min="0" name="preco_original"></label><label>Preço promocional<input type="number" step="0.01" min="0" name="preco_promocional"></label><label>Desconto (%)<input type="number" step="0.01" name="percentual_desconto" readonly></label><label>Código do cupom<input name="codigo_cupom"></label><label>Regras<textarea name="regras"></textarea></label><label>Imagem<input type="file" name="imagem" accept="image/jpeg,image/png,image/webp"></label><button>Salvar promoção</button></form><p id="notice" role="status"></p></main><script type="module">import{acesso,db,upload,notice}from'/parceiro/_layout.js';import{partnerPath}from'/parceiro/paths.js';if(acesso?.guia){const form=document.querySelector('#form'),id=new URLSearchParams(location.search).get('id');let original=null;if(id){const{data,error}=await db.from('vantagens').select('*').eq('id',id).eq('estabelecimento_id',acesso.guia.id).maybeSingle();if(error||!data)notice(error?.message||'Promoção não encontrada',true);else{original=data;for(const el of form.elements)if(el.name&&el.name!=='imagem'&&data[el.name]!=null)el.value=el.type==='datetime-local'?String(data[el.name]).slice(0,16):data[el.name];}}else form.elements.data_inicio.value=new Date().toISOString().slice(0,16);function discount(){const a=Number(form.elements.preco_original.value),b=Number(form.elements.preco_promocional.value);form.elements.percentual_desconto.value=a&&form.elements.preco_promocional.value?((a-b)/a*100).toFixed(2):'';}form.elements.preco_original.addEventListener('input',discount);form.elements.preco_promocional.addEventListener('input',discount);form.addEventListener('submit',async e=>{e.preventDefault();try{const f=new FormData(form),dados={};for(const key of['tipo','titulo','descricao','data_inicio','data_fim','preco_original','preco_promocional','percentual_desconto','codigo_cupom','regras'])dados[key]=f.get(key)||null;if(dados.data_fim&&dados.data_fim<dados.data_inicio)throw Error('Fim anterior ao início.');if(dados.preco_original&&dados.preco_promocional&&Number(dados.preco_promocional)>Number(dados.preco_original))throw Error('Preço promocional maior que o original.');if(f.get('imagem')?.size)dados.imagem_url=await upload(f.get('imagem'));else if(original?.imagem_url)dados.imagem_url=original.imagem_url;const{error}=await db.rpc('parceiro_salvar_vantagem',{p_guia_id:acesso.guia.id,p_id:id||null,p_dados:dados});if(error)throw error;location.assign(partnerPath('vantagens'));}catch(err){notice(err.message,true);}});}</script></body></html>
