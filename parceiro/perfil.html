<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Perfil | Parceiro</title><link rel="stylesheet" href="/parceiro/parceiro.css"></head><body><header><strong id="partner-name">Parceiro</strong><button id="logout">Sair</button></header><nav><a href="/parceiro">Início</a><a href="/parceiro/perfil" aria-current="page">Perfil</a><a href="/parceiro/horarios">Horários</a><a href="/parceiro/galeria">Galeria</a><a href="/parceiro/vantagens">Promoções</a></nav><main data-needs-guide><h1>Dados do estabelecimento</h1><form id="form"><label>Descrição<textarea name="descricao" maxlength="1000" rows="5"></textarea><small id="count"></small></label><label>WhatsApp<input name="whatsapp" type="tel" placeholder="5518999999999"></label><label>Telefone<input name="telefone" type="tel"></label><label>Instagram<input name="instagram" type="text"></label><label>Facebook<input name="facebook" type="url"></label><label>Site<input name="site" type="url" placeholder="https://"></label><label>Endereço<input name="endereco"></label><label>Mapa<input name="mapa_url" type="url"><small>Cole o link do Google Maps.</small></label><button>Salvar alterações</button></form><p id="notice" role="status"></p></main><script type="module">import{acesso,salvar,notice}from'/parceiro/_layout.js';if(acesso?.guia){const form=document.querySelector('#form'),keys=['descricao','whatsapp','telefone','instagram','facebook','site','endereco','mapa_url'];for(const k of keys)form.elements[k].value=acesso.guia[k]||'';const count=()=>document.querySelector('#count').textContent=`${form.elements.descricao.value.length}/1000`;form.elements.descricao.addEventListener('input',count);count();form.addEventListener('submit',async e=>{e.preventDefault();try{const dados=Object.fromEntries(new FormData(form));if(dados.whatsapp&&!/^55\d{10,11}$/.test(dados.whatsapp.replace(/\D/g,'')))throw Error('WhatsApp deve incluir 55 e DDD.');dados.whatsapp=dados.whatsapp.replace(/\D/g,'');if(dados.site&&!/^https?:\/\//i.test(dados.site))dados.site='https://'+dados.site;await salvar(dados);}catch(err){notice(err.message,true);}});}</script></body></html>
