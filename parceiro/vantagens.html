<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Promoções | Parceiro</title><link rel="stylesheet" href="/parceiro/parceiro.css"></head><body><header><strong id="partner-name">Parceiro</strong><button id="logout">Sair</button></header><nav><a href="/parceiro">Início</a><a href="/parceiro/perfil">Perfil</a><a href="/parceiro/horarios">Horários</a><a href="/parceiro/galeria">Fotos</a><a href="/parceiro/vantagens" aria-current="page">Promoções</a></nav><main data-needs-guide><h1>Minhas promoções</h1><p>Novas promoções ficam pendentes até a aprovação da equipe.</p><a class="button" href="/parceiro/vantagem-form">Nova promoção</a><div style="overflow:auto"><table><thead><tr><th>Tipo</th><th>Título</th><th>Validade</th><th>Status</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></div><p id="notice" role="status"></p></main><script type="module">import{acesso,db,notice}from'/parceiro/_layout.js';import{partnerPath}from'/parceiro/paths.js';if(acesso?.guia){const{data,error}=await db.from('vantagens').select('id,tipo,titulo,data_fim,ativo').eq('estabelecimento_id',acesso.guia.id).order('created_at',{ascending:false});if(error)notice(error.message,true);else for(const v of data){const tr=document.createElement('tr');for(const value of[v.tipo,v.titulo,v.data_fim?new Date(v.data_fim).toLocaleDateString('pt-BR'):'Sem prazo',v.ativo?'Ativa':'Pendente / inativa']){const td=document.createElement('td');td.textContent=value;tr.append(td);}const actions=document.createElement('td'),edit=document.createElement('a');edit.href=partnerPath('vantagem-form')+'?id='+encodeURIComponent(v.id);edit.textContent='Editar';actions.append(edit);if(v.ativo){const btn=document.createElement('button');btn.textContent='Desativar';btn.onclick=async()=>{const{error}=await db.rpc('parceiro_desativar_vantagem',{p_guia_id:acesso.guia.id,p_id:v.id});if(error)notice(error.message,true);else{v.ativo=false;tr.children[3].textContent='Inativa';btn.remove();}};actions.append(btn);}tr.append(actions);document.querySelector('#rows').append(tr);}}</script></body></html>
