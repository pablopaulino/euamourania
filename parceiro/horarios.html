<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Horários | Parceiro</title><link rel="stylesheet" href="/parceiro/parceiro.css"></head><body><header><strong id="partner-name">Parceiro</strong><button id="logout">Sair</button></header><nav><a href="/parceiro">Início</a><a href="/parceiro/perfil">Perfil</a><a href="/parceiro/horarios" aria-current="page">Horários</a><a href="/parceiro/galeria">Fotos</a><a href="/parceiro/vantagens">Promoções</a></nav><main data-needs-guide><h1>Horários de funcionamento</h1><form id="form"><div id="days"></div><label>Observações<textarea name="opening_hours_note"></textarea></label><label>Texto exibido no site<textarea name="horario"></textarea></label><button>Salvar horários</button></form><p id="notice" role="status"></p></main><script type="module">import{acesso,salvar,notice}from'/parceiro/_layout.js';if(acesso?.guia){const form=document.querySelector('#form'),days=['mon','tue','wed','thu','fri','sat','sun'],labels=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'],current=acesso.guia.opening_hours||{};days.forEach((day,i)=>{const row=document.createElement('div');row.className='card';row.innerHTML=`<strong>${labels[i]}</strong><label><input type="checkbox" name="${day}-closed"> Fechado</label><label>Abertura<input type="time" name="${day}-open"></label><label>Fechamento<input type="time" name="${day}-close"></label>`;document.querySelector('#days').append(row);form.elements[`${day}-closed`].checked=Boolean(current[day]?.closed);form.elements[`${day}-open`].value=current[day]?.open||'08:00';form.elements[`${day}-close`].value=current[day]?.close||'18:00';const toggle=()=>{for(const kind of['open','close'])form.elements[`${day}-${kind}`].disabled=form.elements[`${day}-closed`].checked};form.elements[`${day}-closed`].addEventListener('change',toggle);toggle();});form.elements.horario.value=acesso.guia.horario||'';form.elements.opening_hours_note.value=acesso.guia.opening_hours_note||'';form.addEventListener('submit',async e=>{e.preventDefault();try{const opening_hours={};for(const day of days){const closed=form.elements[`${day}-closed`].checked;opening_hours[day]=closed?{closed:true}:{closed:false,open:form.elements[`${day}-open`].value,close:form.elements[`${day}-close`].value};if(!closed&&opening_hours[day].close<=opening_hours[day].open)throw Error('O fechamento deve ser após a abertura.');}await salvar({opening_hours,opening_hours_note:form.elements.opening_hours_note.value,horario:form.elements.horario.value});}catch(err){notice(err.message,true);}});}</script></body></html>
