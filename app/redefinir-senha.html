<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; connect-src https://omhcpbphvtihqwdkbsbf.supabase.co">
  <title>Redefinir senha | Viva Urânia</title>
  <link rel="icon" href="/favicon.svg">
  <style>
    * { box-sizing: border-box }
    body { margin: 0; min-height: 100svh; padding: 24px; display: grid; place-items: center; background: #fff6ea; color: #163541; font: 1rem/1.5 system-ui, sans-serif }
    main { width: min(100%, 27rem); padding: clamp(24px, 6vw, 40px); background: white; border: 1px solid #e2dbd2; border-radius: 20px }
    img { display: block; width: 112px; height: auto; margin-bottom: 24px }
    h1 { font-size: 1.75rem; line-height: 1.15; margin: 0 0 12px }
    p { margin: 0; color: #455c63 }
    form { margin-top: 20px }
    label { display: block; font-weight: 600; margin-bottom: 16px }
    input, button { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 10px; font: inherit }
    input { display: block; margin-top: 6px; color: inherit; border: 1px solid #8b9a9c }
    button { border: 0; background: #0b4f6c; color: white; font-weight: 700; cursor: pointer }
    button:disabled { opacity: .65 }
    :focus-visible { outline: 3px solid #bf5a16; outline-offset: 2px }
    #feedback:not(:empty) { margin-top: 16px }
  </style>
</head>
<body>
  <main>
    <img src="/assets/logo-viva-urania-coracao.svg" alt="Viva Urânia">
    <h1>Redefinir senha</h1>
    <p id="instructions">Abra o link do e-mail de recuperação para escolher sua nova senha.</p>
    <form id="recovery" hidden>
      <label>Nova senha<input id="password" type="password" autocomplete="new-password" minlength="8" required></label>
      <label>Confirmar nova senha<input id="confirmation" type="password" autocomplete="new-password" minlength="8" required></label>
      <button type="submit">Salvar nova senha</button>
    </form>
    <p id="feedback" role="status" aria-live="polite"></p>
    <noscript>Ative o JavaScript no navegador para redefinir sua senha.</noscript>
  </main>
  <script type="module" src="/assets/js/redefinir-senha.js"></script>
</body>
</html>
